name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release artifact
    runs-on: ubuntu-latest
    env:
      # Optional. Without it the npm mirror step is skipped; GitHub Releases
      # (what the installer and `pglens update` use) is published either way.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build client-next
        run: |
          npm --prefix client-next ci
          npm --prefix client-next run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Pack npm tarball
        run: npm pack

      - name: Generate checksums
        run: sha256sum pglens-*.tgz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pglens-*.tgz
            checksums.txt

      # npm mirrors GitHub Releases: same tarball, published only after the
      # GitHub release exists, so npm is never ahead of the primary source.
      - name: Publish the same tarball to npm
        if: env.NPM_TOKEN != ''
        run: npm publish ./pglens-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
