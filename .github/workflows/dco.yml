name: DCO

on:
  pull_request:
    branches: [dev]

jobs:
  check-signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit is signed off
        run: |
          missing=0
          # HEAD is GitHub's synthetic PR merge commit, which is never signed off;
          # check the PR's own commits (merges excluded) up to its head instead.
          for sha in $(git rev-list --no-merges origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' trailer (DCO). Run: git commit --amend -s (or git rebase --signoff)."
              missing=1
            fi
          done
          exit $missing
